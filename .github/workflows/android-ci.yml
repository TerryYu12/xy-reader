name: Android CI — 云端打包

# 触发：main 分支 push 自动构建；也可在 Actions 页手动 Run workflow
on:
  push:
    branches: [main]
    # 文档/脚本类改动不触发构建（省 CI 分钟；workflow 自身改动仍会触发）
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'scripts/**'
  workflow_dispatch: {}

# 同一分支的旧构建自动取消，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v6

      - name: 安装 Android SDK 组件
        run: |
          SDKMGR=$(command -v sdkmanager || echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMGR" --licenses > /dev/null || true
          yes | "$SDKMGR" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: 配置发布签名（secrets 未配置时回退调试签名）
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks
            printf 'storeFile=release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "已写入发布签名配置（正式签名）"
          else
            echo "未配置签名 secrets，本次使用调试签名"
          fi

      - name: 构建 Release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 整理产物命名（XY-READER-<版本>.apk）
        id: pkg
        run: |
          VERSION=$(grep -oP 'appVersionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "XY-READER-${VERSION}.apk"

      - name: 上传 APK 工件
        uses: actions/upload-artifact@v7
        with:
          name: XY-READER-${{ steps.pkg.outputs.version }}
          path: XY-READER-${{ steps.pkg.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: 失败时上传测试报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
