name: Android CI — 云端打包

# 触发：main 分支 push 自动构建；也可在 Actions 页手动 Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# 同一分支的旧构建自动取消，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 安装 Android SDK 组件
        run: |
          SDKMGR=$(command -v sdkmanager || echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMGR" --licenses > /dev/null || true
          yes | "$SDKMGR" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: 诊断：关键仓库可达性（信息输出，不判失败）
        run: |
          check() { curl -sIL --max-time 20 -o /dev/null -w "%{http_code}" "$1" || echo "FAIL"; }
          KSP_PATH="com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.0.21-1.0.28/com.google.devtools.ksp.gradle.plugin-2.0.21-1.0.28.pom"
          echo "central:       $(check https://repo1.maven.org/maven2/$KSP_PATH)"
          echo "aliyun-public: $(check https://maven.aliyun.com/repository/public/$KSP_PATH)"
          echo "portal:        $(check https://plugins.gradle.org/m2/$KSP_PATH)"
          echo "google:        $(check https://dl.google.com/android/maven2/$KSP_PATH)"

      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: 构建 Release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 整理产物命名（XY-READER-<版本>.apk）
        id: pkg
        run: |
          VERSION=$(grep -oP 'appVersionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "XY-READER-${VERSION}.apk"

      - name: 上传 APK 工件
        uses: actions/upload-artifact@v4
        with:
          name: XY-READER-${{ steps.pkg.outputs.version }}
          path: XY-READER-${{ steps.pkg.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: 失败时上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
