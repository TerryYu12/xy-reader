org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# 并发封顶：默认 worker 数 = CPU 核数（本机 24），会把全 CPU 吃满；构建家用 4 即可
org.gradle.workers.max=4
# Kotlin 编译跑在 Gradle JVM 内：不再另起常驻的 Kotlin 编译守护（默认挂 2 小时、吃约 0.5-0.8G）
kotlin.compiler.execution.strategy=in-process
# 兜底：万一走回守护模式，也把它的堆封住（守护默认 -Xmx3g 太大）
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

android.suppressUnsupportedCompileSdk=36
